croll-margin-top:16px}.gridScroll{overflow:auto;margin:10px 0}.grid{display:grid;gap:2px;background:#264c53;border:2px solid #264c53;width:100%;min-width:calc(var(--cols)*26px)}.cell{position:relative;aspect-ratio:1;border:0;border-radius:0;padding:0;background:white;color:#173b3e;font-size:clamp(17px,2.3vw,23px);min-height:26px;line-height:1;display:block}.cell small{position:absolute;top:2px;left:2px;font-size:9px}.cell span{display:block;padding-top:7px}.cell.block{background:#264c53}.cell.active{background:#dcf2e8}.cell.selected{box-shadow:inset 0 0 0 3px #2484c3;background:#dceefa}.cell.wrong{color:#ae2929;background:#ffe7e7}.clue{padding:10px 0;border-bottom:1px solid #e0ece9;scroll-margin-top:20px}.clue.select{background:#edf6fa;border-radius:7px;padding:10px 7px}.pick{background:transparent;padding:0;border:0;text-align:left;width:100%;line-height:1.65;color:#173b3e;min-height:44px;justify-content:flex-start;font-size:15px}.clueTools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}.clueTools a{font-size:12px}.hint{min-height:36px;padding:4px 12px;font-size:13px}.star{min-height:38px;padding:4px 10px;font-size:13px;white-space:nowrap}.star[aria-pressed=true]{background:#edf7f5;border-color:#147965}.correctLabel{font-size:12px;color:#147965}.checkbar{margin:20px 0}.checkbar .primary{min-width:150px}.status{min-height:28px;color:#195e79}.review{border-bottom:1px solid #d8e6e3;padding:16px 0}.reviewHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.review p{font-size:14px}.overlay{position:fixed;inset:0;background:#14363c80;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.overlay.hintOverlay{z-index:30}.sheet{background:white;border:1px solid #b7d4cf;border-radius:12px;padding:20px;width:min(480px,100%);max-height:85dvh;overflow:auto}.sheet h2{font-size:18px}.sheet input,input.search{width:100%;min-height:48px;border:1px solid #86b8b0;border-radius:6px;padding:8px 10px;background:white;font-size:22px;margin:8px 0}.sheet .actions{margin-top:12px}.sheet .close{margin-left:auto}#inputMessage{min-height:26px;color:#195e79;font-size:14px}#hintText{font-size:28px;padding:14px 0}details{margin-top:24px}summary{cursor:pointer;font-weight:600;padding:8px 0}#history{padding-left:20px;font-size:14px}footer{font-size:12px;margin-top:26px;color:#62777a}.returnButton{display:none;position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:10;box-shadow:0 2px 9px #153c3c25;background:#186884;color:white;border-color:#186884}.guide{max-width:760px}.guide section{margin-top:20px}.guide li{margin:8px 0}.guide .sample{display:grid;grid-template-columns:repeat(3,42px);gap:2px;background:#264c53;border:2px solid #264c53;width:max-content;margin:15px 0}.sample span{background:white;display:grid;place-items:center;height:42px;font-size:22px}.sample .black{background:#264c53}.vocabTools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.vocabTools .search{font-size:16px;flex:1;min-width:180px;margin:0}.vocabCard{margin:12px 0}.vocabCard .meaning{font-size:15px}.vocabCard .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.vocabCard .tools a{font-size:12px}.vocabCard.learned{border-left:4px solid #147965}.empty{padding:24px 0}.caption{font-size:13px;color:#526d73}.saveWarning{color:#a43c1e!important}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #d1e1df}pre{white-space:pre-wrap}

</style></head><body><main class="guide"><header class="pageHead"><div><h1>マイ語彙帳</h1><p class="muted">覚えたい言葉を、少しずつ自分の言葉に。</p></div><a class="navButton" href="nihongo_crossword.html">クロスワードに戻る</a></header><div class="vocabTools"><input class="search" id="search" type="search" aria-label="言葉・読み・意味を検索" placeholder="言葉・読み・意味で検索"><select id="filter" aria-label="学習状況"><option value="all">すべて</option><option value="learning">学習中</option><option value="learned">覚えた</option></select><button id="downloadVocab" type="button">書き出す</button></div><p id="count" class="muted"></p><p id="vocabStatus" role="status"></p><div id="words"></div><footer><p>初級の意味はデジタル大辞泉を参考にやさしい日本語で作成しています。中級・上級の意味は同辞書からの短い引用です。例文は本教材用に作成しています。</p><p>登録内容はこの端末・ブラウザに保存されます。スマホとPCでは別々です。ブラウザの保存データを削除すると、登録内容も消えます。</p></footer></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),key='nihongo-crossword-vocab-v1';let saved={},available=true;
function load(){try{const raw=JSON.parse(localStorage.getItem(key)||'{}');saved=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};saved=Object.fromEntries(Object.entries(saved).filter(([k,w])=>w&&typeof w.kanji==='string'&&typeof w.reading==='string'&&typeof w.clue==='string'));}catch{saved={};available=false}}
function save(){try{localStorage.setItem(key,JSON.stringify(saved));return true}catch{available=false;$('vocabStatus').textContent='保存できませんでした。このブラウザの保存設定を確認してください。';return false}}
function render(){const query=$('search').value.trim(),filter=$('filter').value;const all=Object.entries(saved),words=all.filter(([k,w])=>(!query||[w.kanji,w.reading,w.clue].some(s=>s.includes(query)))&&(filter==='all'||(filter==='learned'?w.learned:!w.learned))).sort((a,b)=>String(b[1].addedAt).localeCompare(String(a[1].addedAt)));$('count').textContent=`登録 ${all.length}語 · 学習中 ${all.filter(([k,w])=>!w.learned).length}語 · 覚えた ${all.filter(([k,w])=>w.learned).length}語`;$('words').replaceChildren();if(!words.length){const msg=document.createElement('p');msg.className='empty';msg.textContent=all.length?'条件に合う言葉はありません。':'まだ登録はありません。クロスワードの答え合わせ後、正解した言葉の「☆ 覚えたい」を押してください。';$('words').append(msg)}
 for(const [id,w] of words){const card=document.createElement('article');card.className='panel vocabCard'+(w.learned?' learned':'');const head=document.createElement('h2');head.textContent=`${w.kanji}（${w.reading}）`;const meaning=document.createElement('p');meaning.className='meaning';meaning.textContent=w.adapted?w.clue:'「'+w.clue+'」';const example=document.createElement('p');example.className='muted';example.textContent='例：'+(w.example||'');const tools=document.createElement('div');tools.className='tools';const toggle=document.createElement('button');toggle.type='button';toggle.textContent=w.learned?'✓ 覚えた → 学習中に戻す':'学習中 → 覚えた';toggle.addEventListener('click',()=>{load();if(!saved[id])return;saved[id].learned=!saved[id].learned;if(save())render()});const remove=document.createElement('button');remove.type='button';remove.textContent='登録解除';remove.addEventListener('click',()=>{load();delete saved[id];if(save())render()});tools.append(toggle,remove);if(typeof w.url==='string'&&/^https:\/\/(kotobank\.jp|dictionary\.goo\.ne\.jp)\//.test(w.url)){const source=document.createElement('a');source.href=w.url;source.target='_blank';source.rel='noopener noreferrer';source.textContent=w.adapted?'参考':'出典';tools.append(source)}card.append(head,meaning,example,tools);$('words').append(card)}
 if(!available)$('vocabStatus').textContent='このブラウザでは保存データを読み込めません。';}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);
$('downloadVocab').addEventListener('click',()=>{const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const rows=[['言葉','読み','意味','例文','学習状況','参考・出典'],...Object.values(saved).map(w=>[w.kanji,w.reading,w.clue,w.example,w.learned?'覚えた':'学習中',w.url])];const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='マイ語彙帳.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
window.addEventListener('storage',e=>{if(e.key===key){load();render()}});window.addEventListener('pageshow',()=>{load();render()});load();render();})();
</script></body></html>
